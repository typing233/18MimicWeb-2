server:
  host: "0.0.0.0"
  port: 8080
  admin_port: 9090
  name: "Apache/2.4.52 (Ubuntu)"

storage:
  backend: "local"  # local | redis | postgres
  local:
    log_dir: "./logs"
  redis:
    url: "redis://localhost:6379/0"
    prefix: "mimicweb:"
  postgres:
    dsn: "postgresql://mimicweb:mimicweb@localhost:5432/mimicweb"

scanner_detection:
  enabled: true
  rules:
    - pattern: "sqlmap|nikto|nmap|dirbuster|gobuster|wfuzz"
      field: "user_agent"
      label: "known_scanner"
    - pattern: "\\.\\./"
      field: "path"
      label: "path_traversal"
    - pattern: "<script|javascript:|on\\w+="
      field: "body"
      label: "xss_probe"
    - pattern: "' OR |\" OR |UNION SELECT|DROP TABLE"
      field: "body"
      label: "sqli_probe"

routes:
  - id: "homepage"
    path: "/"
    method: "GET"
    enabled: true
    response:
      status: 200
      headers:
        Content-Type: "text/html; charset=utf-8"
      body: |
        <!DOCTYPE html>
        <html><head><title>Internal Portal</title></head>
        <body><h1>Welcome to Corp Portal</h1>
        <p>Please <a href="/login">login</a> to continue.</p></body></html>

  - id: "login_page"
    path: "/login"
    method: "GET"
    enabled: true
    response:
      status: 200
      headers:
        Content-Type: "text/html; charset=utf-8"
      body: |
        <!DOCTYPE html>
        <html><head><title>Login - Corp Portal</title></head>
        <body><h1>Login</h1>
        <form method="POST" action="/api/auth/login">
        <input name="username" placeholder="Username"><br>
        <input name="password" type="password" placeholder="Password"><br>
        <button type="submit">Sign In</button></form></body></html>

  - id: "api_users"
    path: "/api/v1/users/{user_id}"
    method: "GET"
    enabled: true
    conditions:
      - field: "header:Authorization"
        pattern: "^Bearer .+"
        action: "proceed"
      - field: "header:Authorization"
        pattern: "^$"
        action: "respond"
        response:
          status: 401
          body: '{"error": "unauthorized", "message": "Bearer token required"}'
    response:
      status: 200
      headers:
        Content-Type: "application/json"
      body: |
        {
          "id": "{{path:user_id}}",
          "name": "User {{path:user_id}}",
          "email": "user{{path:user_id}}@corp.internal",
          "created_at": "{{timestamp_iso}}",
          "session_token": "{{random_hex:32}}"
        }
    delay:
      min_ms: 50
      max_ms: 200

  - id: "api_search"
    path: "/api/v1/search"
    method: "GET"
    enabled: true
    conditions:
      - field: "query:q"
        pattern: ".+"
        action: "proceed"
      - field: "query:q"
        pattern: "^$"
        action: "respond"
        response:
          status: 400
          body: '{"error": "missing query parameter q"}'
    response:
      status: 200
      headers:
        Content-Type: "application/json"
      body: |
        {
          "query": "{{query:q}}",
          "results": [
            {"id": "{{random_uuid}}", "title": "Document {{random_int:1000:9999}}"},
            {"id": "{{random_uuid}}", "title": "Report {{random_int:1000:9999}}"}
          ],
          "timestamp": "{{timestamp_iso}}"
        }
    error_rate: 0.05

  - id: "health_check"
    path: "/health"
    method: "GET"
    enabled: true
    response:
      status: 200
      headers:
        Content-Type: "application/json"
      body: '{"status": "ok", "uptime": "{{uptime_seconds}}s", "version": "2.1.3"}'

  - id: "admin_api_regex"
    path: "^/admin/api/v[0-9]+/.*"
    path_type: "regex"
    method: "ANY"
    enabled: true
    response:
      status: 403
      headers:
        Content-Type: "application/json"
      body: '{"error": "forbidden", "message": "Admin API access denied from {{client_ip}}"}'

  - id: "static_assets"
    path: "^/static/(?P<filepath>.+\\.(?:css|js|png|jpg))$"
    path_type: "regex"
    method: "GET"
    enabled: true
    response:
      status: 404
      headers:
        Content-Type: "application/json"
      body: '{"error": "not_found", "file": "{{regex:filepath}}"}'

  - id: "catch_all"
    path: "/{path:remaining}"
    method: "ANY"
    enabled: true
    priority: 9999
    response:
      status: 404
      headers:
        Content-Type: "text/html"
      body: |
        <!DOCTYPE html>
        <html><head><title>404 Not Found</title></head>
        <body><h1>Not Found</h1>
        <p>The requested URL was not found on this server.</p></body></html>
