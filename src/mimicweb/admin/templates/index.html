<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MimicWeb Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; }
.header { background: #16213e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 1.4rem; color: #00d4aa; }
.stats { display: flex; gap: 1.5rem; font-size: 0.85rem; }
.stat { text-align: center; }
.stat-value { font-size: 1.2rem; font-weight: bold; color: #00d4aa; }
.stat-label { color: #888; }
.container { display: flex; height: calc(100vh - 60px); }
.sidebar { width: 200px; background: #16213e; border-right: 1px solid #0f3460; padding: 1rem 0; }
.sidebar a { display: block; padding: 0.7rem 1.5rem; color: #ccc; text-decoration: none; font-size: 0.9rem; }
.sidebar a:hover, .sidebar a.active { background: #0f3460; color: #00d4aa; }
.main { flex: 1; padding: 1.5rem; overflow-y: auto; }
.filters { display: flex; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; }
.filters input { width: 200px; }
.btn { background: #0f3460; color: #00d4aa; border: 1px solid #00d4aa; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
.btn:hover { background: #00d4aa; color: #1a1a2e; }
.btn-danger { border-color: #e74c3c; color: #e74c3c; }
.btn-danger:hover { background: #e74c3c; color: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th, td { padding: 0.5rem 0.7rem; text-align: left; border-bottom: 1px solid #0f3460; }
th { background: #16213e; color: #00d4aa; position: sticky; top: 0; }
tr:hover { background: #16213e44; }
.suspicious { color: #e74c3c; font-weight: bold; }
.normal { color: #27ae60; }
.badge { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.75rem; margin: 0.1rem; }
.badge-warn { background: #e74c3c33; color: #e74c3c; }
.badge-method { background: #0f346066; color: #4ecdc4; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.route-card { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 1rem; margin-bottom: 0.8rem; }
.route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
.route-path { font-family: monospace; color: #4ecdc4; }
.route-method { font-weight: bold; color: #f39c12; }
.toggle { position: relative; width: 40px; height: 20px; display: inline-block; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 20px; transition: .3s; }
.toggle input:checked + .slider { background: #00d4aa; }
.toggle .slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .3s; }
.toggle input:checked + .slider:before { transform: translateX(20px); }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
.modal.active { display: flex; }
.modal-content { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px; padding: 2rem; width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-content h2 { margin-bottom: 1rem; color: #00d4aa; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; margin-bottom: 0.3rem; color: #aaa; font-size: 0.85rem; }
.form-group input, .form-group textarea, .form-group select { width: 100%; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; padding: 0.5rem; border-radius: 4px; }
.form-group textarea { min-height: 100px; font-family: monospace; font-size: 0.8rem; }
#autoRefresh { accent-color: #00d4aa; }
</style>
</head>
<body>
<div class="header">
    <h1>MimicWeb Admin</h1>
    <div class="stats" id="stats"></div>
</div>
<div class="container">
    <div class="sidebar">
        <a href="#" class="active" data-tab="logs">Request Logs</a>
        <a href="#" data-tab="routes">Routes</a>
        <a href="#" data-tab="config">Config</a>
    </div>
    <div class="main">
        <div id="tab-logs" class="tab-content active">
            <div class="filters">
                <input type="text" id="filterPath" placeholder="Filter by path...">
                <select id="filterMethod">
                    <option value="">All Methods</option>
                    <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
                </select>
                <select id="filterSuspicious">
                    <option value="">All Requests</option>
                    <option value="true">Suspicious Only</option>
                </select>
                <label><input type="checkbox" id="autoRefresh" checked> Auto-refresh</label>
                <button class="btn" onclick="refreshLogs()">Refresh</button>
                <button class="btn" onclick="exportCSV()">Export CSV</button>
            </div>
            <table>
                <thead><tr>
                    <th>Time</th><th>Method</th><th>Path</th><th>IP</th>
                    <th>Status</th><th>Route</th><th>Classification</th><th>Labels</th>
                </tr></thead>
                <tbody id="logBody"></tbody>
            </table>
        </div>
        <div id="tab-routes" class="tab-content">
            <div class="filters">
                <button class="btn" onclick="showAddRoute()">+ Add Route</button>
                <button class="btn" onclick="reloadConfig()">Reload Config</button>
            </div>
            <div id="routeList"></div>
        </div>
        <div id="tab-config" class="tab-content">
            <h3 style="margin-bottom:1rem; color:#00d4aa">Service Info</h3>
            <div id="configInfo" style="font-family:monospace; font-size:0.85rem; line-height:1.8;"></div>
        </div>
    </div>
</div>
<div class="modal" id="routeModal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Route</h2>
        <div class="form-group"><label>ID</label><input id="routeId"></div>
        <div class="form-group"><label>Path</label><input id="routePath"></div>
        <div class="form-group">
            <label>Path Type</label>
            <select id="routePathType"><option value="path">Path (params)</option><option value="regex">Regex</option></select>
        </div>
        <div class="form-group">
            <label>Method</label>
            <select id="routeMethod"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>ANY</option></select>
        </div>
        <div class="form-group"><label>Status Code</label><input id="routeStatus" type="number" value="200"></div>
        <div class="form-group"><label>Response Body</label><textarea id="routeBody"></textarea></div>
        <div class="form-group"><label>Response Headers (JSON)</label><textarea id="routeHeaders">{"Content-Type": "application/json"}</textarea></div>
        <div style="display:flex;gap:0.8rem">
            <button class="btn" onclick="saveRoute()">Save</button>
            <button class="btn btn-danger" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>
<script>
const API = '';
let autoRefreshInterval = null;
let editingRoute = null;

document.querySelectorAll('.sidebar a').forEach(a => {
    a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        document.getElementById('tab-' + a.dataset.tab).classList.add('active');
        if (a.dataset.tab === 'routes') loadRoutes();
    });
});

function formatTime(ts) {
    return new Date(ts * 1000).toLocaleTimeString();
}

async function refreshLogs() {
    const params = new URLSearchParams();
    const path = document.getElementById('filterPath').value;
    const method = document.getElementById('filterMethod').value;
    const suspicious = document.getElementById('filterSuspicious').value;
    if (path) params.set('path', path);
    if (method) params.set('method', method);
    if (suspicious) params.set('suspicious', suspicious);
    params.set('limit', '200');

    const res = await fetch(`${API}/_admin/api/logs?${params}`);
    const data = await res.json();
    const tbody = document.getElementById('logBody');
    tbody.innerHTML = data.entries.map(e => `<tr>
        <td>${formatTime(e.timestamp)}</td>
        <td><span class="badge badge-method">${e.method}</span></td>
        <td title="${e.query}">${e.path}${e.query ? '?...' : ''}</td>
        <td>${e.client_ip}</td>
        <td>${e.status_code}</td>
        <td>${e.route_id || '-'}</td>
        <td class="${e.suspicious ? 'suspicious' : 'normal'}">${e.suspicious ? 'SUSPICIOUS' : 'normal'}</td>
        <td>${e.labels.map(l => `<span class="badge badge-warn">${l}</span>`).join('')}</td>
    </tr>`).join('');
}

async function loadStats() {
    const res = await fetch(`${API}/_admin/api/stats`);
    const data = await res.json();
    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-value">${data.total_requests}</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-value" style="color:#e74c3c">${data.suspicious_requests}</div><div class="stat-label">Suspicious</div></div>
        <div class="stat"><div class="stat-value">${data.active_routes}/${data.total_routes}</div><div class="stat-label">Routes</div></div>
        <div class="stat"><div class="stat-value">${Math.floor(data.uptime_seconds/60)}m</div><div class="stat-label">Uptime</div></div>
    `;
}

async function loadRoutes() {
    const res = await fetch(`${API}/_admin/api/routes`);
    const data = await res.json();
    document.getElementById('routeList').innerHTML = data.routes.map(r => `
        <div class="route-card">
            <div class="route-header">
                <div><span class="route-method">${r.method}</span> <span class="route-path">${r.path}</span>
                    <span style="color:#666;font-size:0.8rem;margin-left:0.5rem">[${r.id}]</span></div>
                <div style="display:flex;gap:0.5rem;align-items:center">
                    <label class="toggle"><input type="checkbox" ${r.enabled !== false ? 'checked' : ''}
                        onchange="toggleRoute('${r.id}', this.checked)"><span class="slider"></span></label>
                    <button class="btn" onclick="editRoute('${r.id}')">Edit</button>
                    <button class="btn btn-danger" onclick="deleteRoute('${r.id}')">Del</button>
                </div>
            </div>
            <div style="font-size:0.8rem;color:#888">Status: ${r.response?.status || 200}
                ${r.delay ? ` | Delay: ${r.delay.min_ms}-${r.delay.max_ms}ms` : ''}
                ${r.error_rate ? ` | Error rate: ${(r.error_rate*100).toFixed(1)}%` : ''}
                ${r.path_type === 'regex' ? ' | Regex' : ''}</div>
        </div>
    `).join('');
}

async function toggleRoute(id, enabled) {
    await fetch(`${API}/_admin/api/routes/${id}/toggle`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({enabled})
    });
}

async function deleteRoute(id) {
    if (!confirm(`Delete route "${id}"?`)) return;
    await fetch(`${API}/_admin/api/routes/${id}`, {method:'DELETE'});
    loadRoutes();
}

function showAddRoute() {
    editingRoute = null;
    document.getElementById('modalTitle').textContent = 'Add Route';
    document.getElementById('routeId').value = '';
    document.getElementById('routeId').disabled = false;
    document.getElementById('routePath').value = '';
    document.getElementById('routeBody').value = '';
    document.getElementById('routeHeaders').value = '{"Content-Type": "application/json"}';
    document.getElementById('routeStatus').value = '200';
    document.getElementById('routeModal').classList.add('active');
}

async function editRoute(id) {
    const res = await fetch(`${API}/_admin/api/routes`);
    const data = await res.json();
    const route = data.routes.find(r => r.id === id);
    if (!route) return;
    editingRoute = id;
    document.getElementById('modalTitle').textContent = 'Edit Route';
    document.getElementById('routeId').value = route.id;
    document.getElementById('routeId').disabled = true;
    document.getElementById('routePath').value = route.path;
    document.getElementById('routePathType').value = route.path_type || 'path';
    document.getElementById('routeMethod').value = route.method;
    document.getElementById('routeStatus').value = route.response?.status || 200;
    document.getElementById('routeBody').value = route.response?.body || '';
    document.getElementById('routeHeaders').value = JSON.stringify(route.response?.headers || {});
    document.getElementById('routeModal').classList.add('active');
}

async function saveRoute() {
    const data = {
        id: document.getElementById('routeId').value,
        path: document.getElementById('routePath').value,
        path_type: document.getElementById('routePathType').value,
        method: document.getElementById('routeMethod').value,
        enabled: true,
        response: {
            status: parseInt(document.getElementById('routeStatus').value),
            body: document.getElementById('routeBody').value,
            headers: JSON.parse(document.getElementById('routeHeaders').value || '{}'),
        }
    };
    if (editingRoute) {
        await fetch(`${API}/_admin/api/routes/${editingRoute}`, {
            method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
        });
    } else {
        await fetch(`${API}/_admin/api/routes`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
        });
    }
    closeModal();
    loadRoutes();
}

function closeModal() { document.getElementById('routeModal').classList.remove('active'); }

async function reloadConfig() {
    await fetch(`${API}/_admin/api/reload`, {method:'POST'});
    loadRoutes();
    loadStats();
}

async function exportCSV() {
    const suspicious = document.getElementById('filterSuspicious').value;
    const params = suspicious ? '?suspicious=true' : '';
    window.open(`${API}/_admin/api/logs/export${params}`);
}

document.getElementById('autoRefresh').addEventListener('change', function() {
    if (this.checked) startAutoRefresh();
    else stopAutoRefresh();
});

function startAutoRefresh() {
    stopAutoRefresh();
    autoRefreshInterval = setInterval(() => { refreshLogs(); loadStats(); }, 3000);
}
function stopAutoRefresh() {
    if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
}

refreshLogs(); loadStats(); startAutoRefresh();
</script>
</body>
</html>
