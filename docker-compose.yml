version: "3.9"

services:
  mimicweb:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MIMICWEB_INSTANCE_ID=node-1
      - MIMICWEB_CONFIG=config/routes-docker.yaml
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  mimicweb-2:
    build: .
    ports:
      - "8081:8080"
    environment:
      - MIMICWEB_INSTANCE_ID=node-2
      - MIMICWEB_CONFIG=config/routes-docker.yaml
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Optional: enable with --profile audit
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mimicweb
      POSTGRES_PASSWORD: mimicweb
      POSTGRES_DB: mimicweb
    volumes:
      - pg-data:/var/lib/postgresql/data
    profiles:
      - audit
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicweb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Audit-mode instances (writes to both Redis + PostgreSQL)
  mimicweb-audit:
    build: .
    ports:
      - "8082:8080"
    environment:
      - MIMICWEB_INSTANCE_ID=audit-1
      - MIMICWEB_CONFIG=config/routes-audit.yaml
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    profiles:
      - audit
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
