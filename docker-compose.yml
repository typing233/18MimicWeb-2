version: "3.9"

services:
  mimicweb:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MIMICWEB_INSTANCE_ID=node-1
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  mimicweb-2:
    build: .
    ports:
      - "8081:8080"
    environment:
      - MIMICWEB_INSTANCE_ID=node-2
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mimicweb
      POSTGRES_PASSWORD: mimicweb
      POSTGRES_DB: mimicweb
    volumes:
      - pg-data:/var/lib/postgresql/data
    profiles:
      - audit
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
